name: Auto Fetch NSDL Data
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas lxml beautifulsoup4
      - run: python fetch_nsdl.py
      - run: |
          if [ -f "nsdl_fpi_latest.csv" ]; then
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            git add nsdl_fpi_latest.csv
            git commit -m "Update NSDL FPI data" || echo "No new changes to commit"
            git push
          else
            echo "CSV not created, skipping git commit"
          fi
